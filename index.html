:root{--sky:#c9d5ee;--lemon:#ffe79a;--bg:#efefef;--card:#ffffff;--txt:#1a1a1a;--sub-rgb:118,118,118;--sub:#767676;--accent:#325ab1;--accent-rgb:50,90,177;--border:rgba(var(--sub-rgb),.35);--yellow:#ffc401;--warm:#1a1a1a;--warm-bg:rgba(255,196,1,.32);--ov:rgba(0,0,0,.45);
  /* 간격 기준값: 헤더 하단 여백 / 헤더 끝→첫 컨텐츠. 탭별로 다르게 하려면 아래 [data-view] 규칙에서 변수만 바꾼다 */
  --hpb:8px;--cpt:6px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
html{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable}
@media (hover:hover) and (pointer:fine){
.sb{scrollbar-gutter:stable}
html::-webkit-scrollbar,.sb::-webkit-scrollbar{width:12px;height:12px}
html::-webkit-scrollbar-track,.sb::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb,.sb::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:10px;background-clip:padding-box;transition:background .25s}
html.scrolling::-webkit-scrollbar-thumb,.sb.scrolling::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);border:3px solid transparent;background-clip:padding-box}
html.scrolling::-webkit-scrollbar-thumb:hover,.sb.scrolling::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.42);border:3px solid transparent;background-clip:padding-box}
html,.sb{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,0) transparent}
html.scrolling,.sb.scrolling{scrollbar-color:rgba(0,0,0,.28) transparent}
}
html,body{margin:0;padding:0;font-weight:500;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit}
html.lock{overflow:hidden}
.wrap{max-width:520px;margin:0 auto;min-height:100vh}
/* 헤더 2단: 최상단 헤더(제목·아이콘·메뉴, 그라데이션 여기만, 하단 8px) + 서브헤더(검색창/서랍, 상단 0, 하단 8px) */
.hdwrap{position:sticky;top:0;z-index:15}
header{background:linear-gradient(180deg,#ffffff,var(--bg));padding:12px 12px var(--hpb)}
.subhd{background:var(--bg);padding:0 12px var(--hpb)}
body[data-view=route] .subhd,body[data-view=my] .subhd{display:none}
.title{display:flex;align-items:center;gap:9px;margin:0;padding-right:43px;min-height:34px}
.viewtoggle button{display:inline-flex;align-items:center;gap:3px;font-weight:700}.viewtoggle button svg{width:14px;height:14px;flex:0 0 auto}

.card .ta{--s:19px;position:absolute;left:4px;top:4px;margin:0}
.tbwrap{position:relative}
.viewtoggle{gap:3px}.viewtoggle button{padding:6px 7px;gap:0;transition:padding .3s ease,background-color .25s,color .25s,border-color .25s;font-weight:700}
.viewtoggle button.active{padding:6px 10px}
.viewtoggle .bl{display:grid;grid-template-columns:0fr;margin-left:0;transition:grid-template-columns .3s ease,margin-left .3s ease}
.viewtoggle .bl>span{overflow:hidden;min-width:0;white-space:nowrap}
.viewtoggle button.active .bl{grid-template-columns:1fr;margin-left:4px}
.treebox{scrollbar-width:none}.treebox::-webkit-scrollbar{display:none;width:0;height:0}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:3px}
.zoom button{width:38px;height:32px;border:0;background:var(--sky);color:var(--accent);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.zoom svg{display:block;fill:none;stroke:currentColor;stroke-width:3.6;stroke-linecap:round}
.zoom button:first-child{border-radius:999px 0 0 999px}.zoom button:last-child{border-radius:0 999px 999px 0}
.zoom button:disabled{opacity:.4;cursor:default}

  setTimeout(next,0)}
function authGate(){const on=!!CUR_USER;document.body.classList.toggle('authed',on);['#vt-my','#saveRoute'].forEach(q=>{const e=$(q);if(e)e.disabled=!on})}
const ICLOGIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4.5a1.5 1.5 0 0 1 1.5 1.5v13a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="M3.5 12H10"/><path d="M9 7.5L15 12L9 16.5Z" fill="currentColor" stroke-width="1.6"/></svg>',ICLOGOUT='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10"/><path d="M10 12h6.5"/><path d="M15.5 7.5L21 12l-5.5 4.5Z" fill="currentColor" stroke-width="1.6"/></svg>';
$('#loginBtn').innerHTML=ICLOGIN;
function updateAuthUI(){if(CUR==='my'){if(CUR_USER)drawMy();else view('route')}authGate();const b=$('#loginBtn');b.innerHTML=CUR_USER?ICLOGOUT:ICLOGIN;b.setAttribute('aria-label',CUR_USER?'로그아웃':'로그인')}
$('#loginBtn').onclick=()=>{
  if(CUR_USER){fbAuth&&fbAuth.signOut();return}
  if(!fbAuth)return
  fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(err=>{if(err&&err.code==='auth/popup-closed-by-user')return;console.error('구글 로그인 실패(Firebase 콘솔에서 Google 로그인 방식 활성화 확인)',err)})};
if(fbAuth){fbAuth.onAuthStateChanged(user=>{
  if(user){CUR_USER=user.uid;CUR_NAME=user.displayName||user.email||'사용자';
    db.collection('digilabRoutes').doc(user.uid).get().then(doc=>{const remote=doc.exists?(doc.data().routes||[]):[];ROUTES=remote;updateAuthUI()}).catch(e=>{console.error('불러오기 실패(Firestore 규칙 확인 필요)',e);updateAuthUI()})}
  else{CUR_USER=null;CUR_NAME=null;ROUTES=[];updateAuthUI()}})}
// ---------- 스크롤바 (스크롤할 때만 표시) ----------
function hookScroll(t,el){let h;t.addEventListener('scroll',()=>{el.classList.add('scrolling');clearTimeout(h);h=setTimeout(()=>el.classList.remove('scrolling'),650)},{passive:true})}
(()=>{const b=$('#treebox');let d=null;
b.addEventListener('mousedown',e=>{if(e.button||e.target.closest('.tn'))return;d={x:e.clientX,y:e.clientY,l:b.scrollLeft,t:b.scrollTop};b.classList.add('grabbing');e.preventDefault()});
window.addEventListener('mousemove',e=>{if(!d)return;b.scrollLeft=d.l-(e.clientX-d.x);b.scrollTop=d.t-(e.clientY-d.y)});
window.addEventListener('mouseup',()=>{d=null;b.classList.remove('grabbing')})})();
(()=>{let d=null,mv=false;
document.addEventListener('mousedown',e=>{const b=e.target.closest&&e.target.closest('.mys');if(e.button||!b)return;d={b,x:e.clientX,l:b.scrollLeft};mv=false;b.classList.add('grabbing');e.preventDefault()});
window.addEventListener('mousemove',e=>{if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>4)mv=true;d.b.scrollLeft=d.l-dx});
window.addEventListener('mouseup',()=>{if(d){d.b.classList.remove('grabbing');d=null}});
document.addEventListener('click',e=>{if(mv){e.stopPropagation();e.preventDefault();mv=false}},true)})();
hookScroll(window,document.documentElement);['#mbody','#treebox'].forEach(s=>hookScroll($(s),$(s)));
// ---------- 시작 ----------
drawSel();drawModes();drawFilters();updateAuthUI();view('route');

</script>
</body>
</html>
