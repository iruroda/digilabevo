:root{--bg:#efefef;--card:#ffffff;--txt:#1a1a1a;--sub-rgb:118,118,118;--sub:#767676;--accent:#325ab1;--accent-rgb:50,90,177;--border:rgba(var(--sub-rgb),.35);--yellow:#ffc401;--warm:#1a1a1a;--warm-bg:rgba(255,196,1,.32);--ov:rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
img{-webkit-user-drag:none;user-drag:none;-webkit-touch-callout:none}
html{overflow-y:scroll;overflow-x:hidden;scrollbar-gutter:stable}
@media (hover:hover) and (pointer:fine){
.sb{scrollbar-gutter:stable}
html::-webkit-scrollbar,.sb::-webkit-scrollbar{width:12px;height:12px}
html::-webkit-scrollbar-track,.sb::-webkit-scrollbar-track{background:transparent}
html::-webkit-scrollbar-thumb,.sb::-webkit-scrollbar-thumb{background:transparent;border:3px solid transparent;border-radius:10px;background-clip:padding-box;transition:background .25s}
html.scrolling::-webkit-scrollbar-thumb,.sb.scrolling::-webkit-scrollbar-thumb{background:rgba(0,0,0,.28);border:3px solid transparent;background-clip:padding-box}
html.scrolling::-webkit-scrollbar-thumb:hover,.sb.scrolling::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.42);border:3px solid transparent;background-clip:padding-box}
html,.sb{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,0) transparent}
html.scrolling,.sb.scrolling{scrollbar-color:rgba(0,0,0,.28) transparent}
}
html,body{margin:0;padding:0;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",sans-serif}
input,textarea{-webkit-user-select:text;user-select:text;font-family:inherit}
button{font-family:inherit}
html.lock{overflow:hidden}
.wrap{max-width:520px;margin:0 auto;min-height:100vh}
header{position:sticky;top:0;z-index:15;background:linear-gradient(180deg,#ffffff,var(--bg) 55%);padding:12px 12px 8px}
.title{display:flex;align-items:center;gap:9px;margin:0 0 9px;padding-right:43px;min-height:34px}
.title svg.logo{flex:0 0 auto;cursor:pointer}
.title svg.logo{width:16px;height:16px}
.mtitle svg.logo{width:15px;height:15px}
.viewtoggle button{display:inline-flex;align-items:center;gap:3px}.viewtoggle button svg{width:14px;height:14px;flex:0 0 auto}

.tbwrap{position:relative}
.viewtoggle{gap:3px}.viewtoggle button{padding:6px 7px;gap:0;transition:padding .3s ease,background-color .25s,color .25s,border-color .25s}
.viewtoggle button.active{padding:6px 10px}
.viewtoggle .bl{display:grid;grid-template-columns:0fr;margin-left:0;transition:grid-template-columns .3s ease,margin-left .3s ease}

.viewtoggle button.active .bl{grid-template-columns:1fr;margin-left:4px}

.zoom button:first-child{border-radius:999px 0 0 999px}.zoom button:last-child{border-radius:0 999px 999px 0}
.zoom button:disabled{background:#c4c4c4;cursor:default}

const BATTLE_EXP=80000,VISIT=3,FUSION=200,CAP=10;
// 곤란도가 같을 때: 디지뱅크 방문 > 전투 > 팜 훈련 > 우정 > 조그레스 진화 순으로 ‘감수할 만한’ 비용이라, 조그레스 진화를 가장 피하고 방문을 가장 덜 피한다

const nBattles=(i,L)=>Math.ceil(EXPT[D[i].ec][Math.max(1,Math.min(99,L))-1]/BATTLE_EXP);

const _ec=new Map();
function edgeCurve(from,to){const key=from*1000+to;let o=_ec.get(key);if(o)return o;
  const c=D[to].cond,nl=nBattles(from,c.LVL||1),nmax=Math.max(nl,nBattles(from,99)),rq=SK.map(k=>c[k]||0);o=[];let last=null;
  for(let n=nl;n<=nmax;n++){const L=lvAfter(from,n);const tau=SK.map((k,j)=>rq[j]?Math.max(0,rq[j]-statAt(from,k,L)):0);
    if(last&&tau.every((v,j)=>v===last[j]))continue;o.push({n,tau});last=tau;if(tau.every(v=>v===0))break}
  _ec.set(key,o);return o}
function findRouteHard(start,end,skills,ban,av){

  for(const [w,budget] of [[1,10000],[2,25000],[3,Infinity]]){const r=solveHard(start,end,skills,ban,w,budget,av);if(!r.over){if(w>1&&!r.err)r.approx=true;return r}}
}
function solveHard(start,end,skills,ban,w,budget,av){
  const WF=av&&av.F?1000:1,WT=av&&av.T?1000:1;
  const K=skills.length,FULL=(1<<K)-1,W=1<<K,seen=new Map(),heap=[],Z=[0,0,0,0,0,0];
  // 노드별 스킬 습득에 필요한 전투 횟수
  const sn=new Map();const need=x=>{let r=sn.get(x);if(!r){r=[];skills.forEach((id,k)=>{const mv=D[x].moves.find(q=>q[0]===id);if(mv)r.push([k,nBattles(x,mv[1])])});sn.set(x,r)}return r};
  const gain=(x,n)=>{let g=0;for(const [k,nb] of need(x))if(nb<=n)g|=1<<k;return g};
  const _eo=new Map();
  const opts=(x,nb,evo)=>{const key=x*1000+nb+(evo?0:1e7);let o=_eo.get(key);if(o)return o;
    const cur=evo?edgeCurve(x,nb):[{n:0,tau:Z}],nl=cur[0].n,ns=new Set(cur.map(q=>q.n));
    for(const [,b] of need(x))if(b>=nl)ns.add(b);
    const list=[...ns].sort((p,q)=>p-q);o=[];let lp=null,lg=-1;
    for(const n of list){let st=cur[0];for(const q of cur)if(q.n<=n)st=q;const g=gain(x,n);
      if(lp&&st===lp&&g===lg)continue;lp=st;lg=g;o.push({n,tau:st.tau,g})}

  const N=D.length,rev=Array.from({length:N},()=>[]);

    for(const v of D[u].next)if(!ban.has(v)){if(isMC(u,v)){rev[v].push([u,0]);continue}const n0=edgeCurve(u,v)[0].n;rev[v].push([u,(n0>0?n0+VISIT:0)+(D[v].cond.Fus?FUSION:0)])}
    for(const v of D[u].prev)if(!ban.has(v))rev[v].push([u,0])}
  const back=(src)=>{const d=new Float64Array(N).fill(Infinity),h=[];src.forEach(([i,v])=>{if(v<d[i]){d[i]=v;heapPush(h,[v,i])}});
    while(h.length){const [dv,v]=heapPop(h);if(dv>d[v])continue;for(const [u,w] of rev[v]){const nd=dv+w;if(nd<d[u]){d[u]=nd;heapPush(h,[nd,u])}}}return d};
  const dEnd=end!=null?back([[end,0]]):null;
  const dSk=skills.map((id,k)=>{const src=[];for(let i=0;i<N;i++)if(!ban.has(i)&&D[i].moves.some(q=>q[0]===id)){const e=dEnd?dEnd[i]:0;if(e<Infinity)src.push([i,e])}return back(src)});
  const hOf=(x,mask)=>{let m=dEnd?dEnd[x]:0;for(let k=0;k<K;k++)if(!(mask>>k&1)&&dSk[k][x]>m)m=dSk[k][x];return m};
  const ge=(a,T,F,c)=>a.c<=c&&a.F>=F&&a.T[0]>=T[0]&&a.T[1]>=T[1]&&a.T[2]>=T[2]&&a.T[3]>=T[3]&&a.T[4]>=T[4]&&a.T[5]>=T[5];
  const le=(a,T,F,c)=>c<=a.c&&F>=a.F&&T[0]>=a.T[0]&&T[1]>=a.T[1]&&T[2]>=a.T[2]&&T[3]>=a.T[3]&&T[4]>=a.T[4]&&T[5]>=a.T[5];
  const add=(st)=>{const key=st.node*W+st.mask;let l=seen.get(key);if(!l){l=[];seen.set(key,l)}
    for(const a of l)if(ge(a,st.T,st.F,st.c))return;

    const [c0,s]=heapPop(heap);if(s.dead)continue;if(++exp>budget)return {over:1};
    if(s.fin){const chain=[];for(let q=s.s;q;q=q.par)chain.push(q);chain.reverse();
      // learn[i]: 루트 i번째 디지몬에서 새로 익힌 스킬 비트 (마지막 칸은 도착 디지몬)
      const learn=chain.map((q,ix)=>ix<chain.length-1?chain[ix+1].info.g:s.fg);

    const x=s.node;
    if(end==null||x===end){let nf=0,ok=true,g=s.mask;for(const [k,nb] of need(x)){if(!(s.mask>>k&1)){g|=1<<k;if(nb>nf)nf=nb}}

    for(const nb of MCP[x]){if(ban.has(nb))continue;
      add({node:nb,mask:s.mask,b:s.b,T:s.T,F:s.F,c:s.c+1e-9,r:s.r,par:s,info:{evo:false,mc:true,n:0,visit:0,tr:null,fr:0,fus:0,g:0}})}

      for(const o of opts(x,nb,false)){const mask2=s.mask|o.g,v=(s.b===0||o.n>0)?VISIT:0;

function heapPush(h,x){h.push(x);let i=h.length-1;while(i>0){const p=(i-1)>>1;if(h[p][0]<=h[i][0])break;[h[p],h[i]]=[h[i],h[p]];i=p}}

function findRoute(start,end,skills,bans,modeKey,av){
  const mo=MODES[modeKey],K=skills.length,FULL=(1<<K)-1,N=D.length,W=1<<K;
  const iso=i=>!D[i].next.length&&!D[i].prev.length;
  if(iso(start)||(end!=null&&iso(end)))return {err:'NX 디지몬은 진화·퇴화 관계가 없어서 루트를 만들 수 없어요.'};

  const ban=new Set(bans);
  if(ban.has(start)||(end!=null&&ban.has(end)))return {err:'출발/도착 디지몬이 제외 목록에 있어요.'};

}
